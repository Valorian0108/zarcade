<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Zarcade mark (D-060): the Watcher, scaled from the character's own
       geometry (viewBox 224x260 at 0.3, centered). Hood, one lit gold eye,
       arcade dark behind it. At 16px it reads as a gold eye in a shadow,
       which is exactly the character. -->
  <defs>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2438" />
      <stop offset="100%" stop-color="#1c1728" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf6e" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#edb64a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#edb64a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#141119" stroke="rgba(237,182,74,0.22)" />

  <!-- cloak, the character's own path -->
  <path
    d="M32 2c-10.2 0-15.6 7.8-16.5 18.6-0.9 10.2-2.7 22.2-4.8 32.4-0.6 2.7 1.2 4.8 3.9 5.1 5.7 0.9 11.7 1.2 17.4 1.2s11.7-0.3 17.4-1.2c2.7-0.3 4.5-2.4 3.9-5.1-2.1-10.2-3.9-22.2-4.8-32.4C47.6 9.8 42.2 2 32 2Z"
    fill="url(#hood)"
    stroke="rgba(255,255,255,0.08)"
  />

  <!-- hood void -->
  <path
    d="M32 8c-6 0-9.6 4.2-9.9 10.2-0.3 5.4 2.4 9 9.9 9s10.2-3.6 9.9-9c-0.3-6-3.9-10.2-9.9-10.2Z"
    fill="#0e0b14"
  />

  <!-- the lit eye -->
  <circle cx="33.2" cy="18.2" r="11" fill="url(#eyeGlow)" />
  <circle cx="33.2" cy="18.2" r="4.1" fill="#edb64a" />
  <circle cx="34.3" cy="18.2" r="1.6" fill="#14101a" />
  <circle cx="31.9" cy="16.7" r="0.75" fill="#ffffff" opacity="0.85" />
</svg>
